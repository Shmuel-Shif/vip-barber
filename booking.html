<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="בחירת כמות האנשים להזמנה אצל זאבי הנאו.">
  <title>כמות האנשים — זאבי הנאו - VIP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Cinzel:wght@500;600&family=Frank+Ruhl+Libre:wght@400;500&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip-link" href="#content">דלג לתוכן</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="VIP, דף הבית">
      <img src="assets/logo/logo.png" alt="" width="1090" height="1183">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="פתיחת תפריט">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="ניווט ראשי">
      <a href="index.html">בית</a>
      <a href="booking.html" aria-current="page">קבע תור</a>
      <a href="about.html">אודות</a>
      <a href="orders.html">ההזמנות שלי</a>
    </nav>
  </header>
  <main id="content">
    <section class="party" id="party" aria-labelledby="party-title">
      <h1 id="party-title">כמה אנשים מסתפרים?</h1>
      <p class="party__lead">בוחרים כמה מבוגרים, ילדים וחבילות VIP. סידור זקן הוא תוספת.</p>

      <div class="party__rows">
        <div class="party__row">
          <div>
            <h2 id="adults-label">מבוגרים</h2>
            <p id="adult-rate">תספורת מבוגר</p>
          </div>
          <div class="stepper" role="group" aria-labelledby="adults-label">
            <button type="button" id="adults-minus" aria-label="פחות מבוגרים">−</button>
            <span id="adults-count">0</span>
            <button type="button" id="adults-plus" aria-label="עוד מבוגר">+</button>
          </div>
        </div>
        <div class="party__row">
          <div>
            <h2 id="children-label">ילדים</h2>
            <p id="child-rate">תספורת ילד</p>
          </div>
          <div class="stepper" role="group" aria-labelledby="children-label">
            <button type="button" id="children-minus" aria-label="פחות ילדים">−</button>
            <span id="children-count">0</span>
            <button type="button" id="children-plus" aria-label="עוד ילד">+</button>
          </div>
        </div>
        <div class="party__row">
          <div>
            <h2 id="vip-label">חבילת VIP</h2>
            <p id="vip-rate">מחיר בתיאום</p>
          </div>
          <div class="stepper" role="group" aria-labelledby="vip-label">
            <button type="button" id="vip-minus" aria-label="פחות חבילות VIP">−</button>
            <span id="vip-count">0</span>
            <button type="button" id="vip-plus" aria-label="עוד חבילת VIP">+</button>
          </div>
        </div>
        <div class="party__row">
          <div>
            <h2 id="beards-label">סידור זקן</h2>
            <p id="beard-rate">תוספת</p>
          </div>
          <div class="stepper" role="group" aria-labelledby="beards-label">
            <button type="button" id="beards-minus" aria-label="פחות סידורי זקן">−</button>
            <span id="beards-count">0</span>
            <button type="button" id="beards-plus" aria-label="עוד סידור זקן">+</button>
          </div>
        </div>
      </div>

      <div id="party-summary" class="party__summary" aria-live="polite"></div>
      <a class="btn btn--gold party__continue" id="party-continue" href="booking-next.html" aria-disabled="true">המשך</a>
      <noscript>
        <p class="services-fallback">כדי לבחור כמות צריך לאפשר JavaScript. אין כאן שליחה לשרת.</p>
      </noscript>
    </section>
  </main>
  <script src="js/demo-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
