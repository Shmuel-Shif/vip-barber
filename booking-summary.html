<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">

  <meta name="description" content="סיכום בקשת התור אצל זאבי הנאו. השליחה נשמרת בחשבון אחרי התחברות.">
  <title>סיכום ההזמנה — זאבי הנאו - VIP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <a class="skip-link" href="#content">דלג לתוכן</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="VIP, דף הבית">
      <img src="assets/logo/logo.png" alt="" width="1090" height="1183">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="פתיחת תפריט">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="ניווט ראשי">
      <a href="index.html">בית</a>
      <a href="booking.html" aria-current="page">קבע תור</a>
      <a href="orders.html">ההזמנות שלי</a>
    </nav>
  </header>
  <main id="content">
    <section class="details summary" id="booking-summary" aria-labelledby="summary-title">
      <h1 id="summary-title">סיכום ההזמנה</h1>

      <section class="details__group" aria-labelledby="summary-service-title">
        <h2 id="summary-service-title">השירות</h2>
        <div id="summary-service"></div>
        <div id="booking-saved" class="summary__lines"></div>
      </section>

      <section class="details__group" aria-labelledby="summary-when-title">
        <h2 id="summary-when-title">תאריך ושעה</h2>
        <div id="summary-when" class="summary__lines"></div>
      </section>

      <section class="details__group" aria-labelledby="summary-customer-title">
        <h2 id="summary-customer-title">פרטי הלקוח</h2>
        <div id="summary-customer" class="summary__lines"></div>
      </section>

      <section class="details__group" aria-labelledby="summary-address-title">
        <h2 id="summary-address-title">כתובת</h2>
        <div id="summary-address" class="summary__lines"></div>
      </section>

      <section class="details__group" aria-labelledby="summary-pay-title">
        <h2 id="summary-pay-title">אופן התשלום</h2>
        <div id="summary-payment" class="summary__lines"></div>
      </section>

      <section class="details__group" aria-labelledby="summary-photo-title">
        <h2 id="summary-photo-title">תמונה של הכניסה לבניין</h2>
        <div id="summary-photo" class="summary__lines"></div>
      </section>

      <p id="send-status" class="orders-note" role="status"></p>
      <div id="large-party" class="summary__contact" hidden>
        <p id="large-party-text"></p>
        <a id="large-whatsapp" class="btn btn--gold" target="_blank" rel="noopener noreferrer">וואטסאפ לזאבי</a>
        <a id="large-phone" class="btn btn--ghost" href="tel:+972512177021">טלפון</a>
        <a class="btn btn--ghost" href="booking.html">חזרה לבחירת כמות</a>
      </div>
      <a class="btn btn--ghost details__continue" href="booking-details.html?edit=1">חזרה לעריכת הפרטים</a>
      <button type="button" class="btn btn--gold summary__send" id="send-request">שליחה בקשה</button>
    </section>
    <a class="summary__whatsapp" href="https://wa.me/972512177021?text=%D7%94%D7%99%D7%99%20%D7%94%D7%92%D7%A2%D7%AA%D7%99%20%D7%9E%D7%90%D7%A4%D7%9C%D7%99%D7%A7%D7%A6%D7%99%D7%99%D7%AA%20%D7%96%D7%90%D7%91%D7%99%20%D7%94%D7%A0%D7%90%D7%95%20-%20VIP" target="_blank" rel="noopener noreferrer" aria-label="וואטסאפ, היי הגעתי מאפליקציית זאבי הנאו - VIP">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">

      </svg>
    </a>
    <dialog class="sent-modal" id="sent-modal">
      <h2>בקשתכם נשלחה</h2>
      <a class="btn btn--gold" href="orders.html">ההזמנות שלי</a>
      <button type="button" class="btn btn--ghost" id="sent-close">סגירה</button>
    </dialog>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
