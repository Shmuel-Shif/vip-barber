<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="בחירת תאריך ושעה אצל זאבי הנאו.">
  <title>בחר תאריך ושעה — זאבי הנאו - VIP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Frank+Ruhl+Libre:wght@400;500&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body class="date-screen">
  <a class="skip-link" href="#content">דלג לתוכן</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="VIP, דף הבית">
      <img src="assets/logo/logo.png" alt="" width="1090" height="1183">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="פתיחת תפריט">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="ניווט ראשי">
      <a href="index.html">בית</a>
      <a href="booking.html" aria-current="page">קבע תור</a>
      <a href="orders.html">ההזמנות שלי</a>
    </nav>
  </header>
  <main id="content">
    <section class="cal" id="booking-calendar" aria-labelledby="cal-title">
      <h1 id="cal-title">בחר תאריך ושעה</h1>
      <p class="cal__hint">אפשר להזמין את השבוע הנוכחי ואת השבוע הבא. ביום ראשון החלון מתקדם.</p>
      <div class="cal__nav">
        <button type="button" id="cal-prev" aria-label="החודש הקודם">‹</button>
        <h2 id="cal-label"></h2>
        <button type="button" id="cal-next" aria-label="החודש הבא">›</button>
      </div>
      <div class="cal__weekdays" aria-hidden="true">
        <span>א</span><span>ב</span><span>ג</span><span>ד</span><span>ה</span><span>ו</span><span>ש</span>
      </div>
      <div id="cal-grid" class="cal__grid" role="grid" aria-labelledby="cal-label"></div>
      <div id="cal-times" class="cal__times"></div>
      <p id="cal-status" class="orders-note" role="status"></p>
      <button type="button" class="btn btn--gold cal__continue" id="cal-continue" disabled>המשך</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
