<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="ההזמנות שלי ב־VIP.">
  <title>ההזמנות שלי — זאבי הנאו - VIP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip-link" href="#content">דלג לתוכן</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="VIP, דף הבית">
      <img src="assets/logo/logo.png" alt="" width="1090" height="1183">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="פתיחת תפריט">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="ניווט ראשי">
      <a href="index.html">בית</a>
      <a href="booking.html">קבע תור</a>
      <a href="orders.html" aria-current="page">ההזמנות שלי</a>
    </nav>
  </header>
  <main id="content" class="page orders-page">
    <h1>ההזמנות שלי</h1>
    <p class="orders-note">אחרי התחברות רואים כאן את ההזמנות של החשבון. הזמנות שכבר נשמרו במכשיר הזה נשארות ולא נמחקות. אפשר לבטל עד 7 שעות לפני התור.</p>
    <section class="details__group" id="account-box" aria-labelledby="account-title">
      <h2 id="account-title">חשבון לקוח</h2>
      <form id="account-form" method="post" action="orders.html" autocomplete="on" novalidate>
        <div class="field">
          <label for="account-username">שם משתמש</label>
          <input id="account-username" name="username" type="text" autocomplete="username" maxlength="24" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="account-password">סיסמה</label>
          <input id="account-password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        </div>
        <p id="account-status" class="orders-note" role="status"></p>
        <button type="submit" class="btn btn--gold" id="account-login">התחברות</button>
        <button type="button" class="btn btn--ghost" id="account-signup">הרשמה</button>
        <button type="button" class="btn btn--ghost" id="account-logout" hidden>יציאה</button>
      </form>
    </section>
    <p id="orders-feedback" class="orders-note" role="status"></p>
    <div id="orders-list"></div>
    <dialog class="sent-modal" id="order-cancel" aria-labelledby="order-cancel-title">
      <h2 id="order-cancel-title">אתה בטוח?</h2>
      <p id="order-cancel-text">לבטל את ההזמנה?</p>
      <button type="button" class="btn btn--gold" id="order-cancel-yes">כן, לבטל</button>
      <button type="button" class="btn btn--ghost" id="order-cancel-no">לא</button>
    </dialog>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
  <script src="js/supabase-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
