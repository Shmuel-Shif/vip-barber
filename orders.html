<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="ההזמנות שלי ב־VIP.">
  <title>ההזמנות שלי — זאבי הנאו - VIP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip-link" href="#content">דלג לתוכן</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="VIP, דף הבית">
      <img src="assets/logo/logo.png" alt="" width="1090" height="1183">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="פתיחת תפריט">
      <span class="hamburger" aria-hidden="true"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="ניווט ראשי">
      <a href="index.html">בית</a>
      <a href="booking.html">קבע תור</a>
      <a href="orders.html" aria-current="page">ההזמנות שלי</a>
    </nav>
  </header>
  <main id="content" class="page orders-page">
    <h1 id="orders-title">ההזמנות שלי</h1>
    <p id="orders-intro" class="orders-note">אפשר לבטל עד 7 שעות לפני התור.</p>
    <p id="orders-feedback" class="orders-note" role="status"></p>
    <div id="orders-list"></div>
    <dialog class="sent-modal" id="order-cancel" aria-labelledby="order-cancel-title">
      <h2 id="order-cancel-title">אתה בטוח?</h2>
      <p id="order-cancel-text">לבטל את ההזמנה?</p>
      <button type="button" class="btn btn--gold" id="order-cancel-yes">כן, לבטל</button>
      <button type="button" class="btn btn--ghost" id="order-cancel-no">לא</button>
    </dialog>
  </main>
  <div class="notify-prompt" id="notify-prompt" hidden>
    <div class="notify-prompt__card" role="dialog" aria-modal="true" aria-labelledby="notify-title">
      <h2 id="notify-title">אל תפספס את עדכון התור שלך</h2>
      <p id="notify-text">הפעל התראות מ־VIP וקבל עדכון כשהתור שלך מאושר או כשיש שינוי בהזמנה.</p>
      <div class="notify-prompt__actions">
        <button type="button" class="btn btn--gold" id="notify-yes">הפעלת התראות</button>
        <button type="button" class="btn btn--ghost" id="notify-later">אולי מאוחר יותר</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
  <script src="js/supabase-client.js?v=push4"></script>
  <script src="script.js?v=push4"></script>
</body>
</html>
